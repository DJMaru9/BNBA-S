<style>
:root{
  /* Palet diambil dari lambang Badan Gizi Nasional */
  --ink:#08172E; --paper:#FFFFFF; --mist:#F0F4F7; --line:#D5E0E8;
  --navy:#123A73; --navy-dk:#061D42; --navy-lt:#E2EDF2;
  --gold:#9D7C38; --gold-lt:#F5EEDF;
  --rose:#9E3A33; --rose-lt:#F6E6E4;
  --sky:#2F6DA0; --sky-lt:#E2EEF6;
  --leaf:#5F9B47; --leaf-lt:#EAF3E4;
  --slate:#56687D;
  --r:10px; --sb:236px;
  --shadow:0 1px 2px rgba(15,31,26,.06),0 8px 24px -12px rgba(15,31,26,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  background:var(--mist); color:var(--ink);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px;border-radius:4px}

/* ---------- kerangka ---------- */
.shell{display:flex;min-height:100dvh}
.sidebar{
  width:var(--sb);flex:0 0 var(--sb);background:var(--navy-dk);color:#D8E6F0;
  padding:22px 14px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100dvh;
}
.brand{display:flex;gap:11px;align-items:center;padding:0 6px}
.brand .mark{
  width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:#FFF;
  padding:2px;object-fit:contain;box-shadow:0 0 0 1px rgba(255,255,255,.35)
}
.brand h1{font-size:14px;font-weight:800;color:#FFF;letter-spacing:-.01em;line-height:1.25}
.brand p{font-size:10.5px;color:#8FA9C6;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .cap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#7690B0;padding:8px 10px 4px}
.nav button{
  display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;
  color:#C3D6E6;font-size:13.5px;font-weight:500;text-align:left;transition:background .14s,color .14s
}
.nav button:hover{background:rgba(255,255,255,.07);color:#FFF}
.nav button.on{background:#FFF;color:var(--navy-dk);font-weight:600}
.nav .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55;flex:0 0 6px}
.nav button.on .dot{opacity:1}
.nav .badge{margin-left:auto;background:var(--rose);color:#FFF;font-size:10.5px;font-weight:800;
  padding:1px 7px;border-radius:20px;font-family:'IBM Plex Mono',monospace}
.dupname{font-size:12px;color:var(--slate);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* pita hasil pembacaan berkas impor */
.pitaHasil{border-radius:9px;padding:12px 15px;font-size:13.5px;border:1px solid;line-height:1.5}
.pitaHasil.ok{background:var(--leaf-lt);border-color:#BBDDAA;color:#2F5B21}
.pitaHasil.warn2{background:var(--gold-lt);border-color:#E0CB9A;color:#6E5320}
.pitaHasil.err{background:var(--rose-lt);border-color:#E8B9B5;color:#7E2B25}
.pitaHasil .ok{color:#3F7C2A} .pitaHasil .wn{color:var(--gold)} .pitaHasil .er{color:var(--rose)}
/* tabel validasi per baris */
.tblVal thead th{position:sticky;top:0;z-index:2;background:var(--navy);color:#FFF;border-right-color:rgba(255,255,255,.2)}
.tblVal tbody tr.st-g td{background:#FBFDFA} .tblVal tbody tr.st-a td{background:var(--gold-lt)}
.tblVal tbody tr.st-r td{background:var(--rose-lt)}
.tblVal tbody tr:hover td{filter:brightness(.98)}
.sidefoot{margin-top:auto;font-size:11px;color:#8099BA;padding:0 8px;line-height:1.6}
.sync{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#A5BDD6;padding:8px;border-top:1px solid rgba(255,255,255,.1)}
.sync .led{width:7px;height:7px;border-radius:50%;background:#8099BA}
.sync.ok .led{background:#4FC08A} .sync.err .led{background:#E88B84}
.sync.busy .led{background:#EFC15E;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  background:var(--paper);border-bottom:1px solid var(--line);padding:15px 26px;
  display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20
}
.topbar h2{font-size:19px;font-weight:800;letter-spacing:-.02em}
.topbar .sub{font-size:12.5px;color:var(--slate);margin-top:1px}
.topbar .sp{flex:1}
.page{padding:24px 26px 60px;max-width:1320px;width:100%}

/* ---------- kontrol ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;
  background:var(--navy);color:#FFF;font-weight:600;font-size:13px;transition:filter .14s
}
.btn:hover{filter:brightness(1.09)}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--mist);filter:none}
.btn.danger{background:var(--rose)}
.btn.sm{padding:6px 11px;font-size:12.5px}
input[type=text],input[type=date],input[type=password],select,textarea{
  width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--paper)
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px var(--navy-lt)}
label.f{display:block;font-size:11.5px;font-weight:600;color:var(--slate);margin-bottom:5px;letter-spacing:.01em}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card .hd{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.card .hd h3{font-size:14px;font-weight:700}
.card .hd .note{font-size:11.5px;color:var(--slate)}
.card .bd{padding:18px}

/* ---------- pita sapaan ---------- */
.sapa{position:relative;overflow:hidden;border-radius:14px;margin-bottom:16px;
  background:linear-gradient(120deg,#061D42 0%,#123A73 52%,#2F6DA0 100%);
  color:#EAF2F8;display:flex;align-items:center;gap:18px;padding:22px 26px;min-height:150px}
.sapa::before{content:'';position:absolute;inset:0;
  background:radial-gradient(700px 200px at 12% 120%,rgba(157,124,56,.28),transparent 60%);
  pointer-events:none}
.sapa .teks{position:relative;z-index:2;flex:1;min-width:0}
.sapa .hai{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:#9FC3E4;font-weight:700}
.sapa h2{font-size:24px;font-weight:800;letter-spacing:-.025em;line-height:1.28;margin-top:8px;color:#FFF}
.sapa h2 b{color:#F0D9AE}
.sapa p{font-size:13px;color:#B9D2E8;margin-top:9px;line-height:1.6}
.sapa .gbr{position:relative;z-index:2;flex:0 0 260px;max-width:260px}
.sapa .gbr svg{width:100%;height:auto;display:block}
@media (max-width:820px){ .sapa{flex-direction:column;align-items:flex-start;padding:20px}
  .sapa .gbr{flex:none;width:200px;align-self:center} .sapa h2{font-size:20px} }

/* gerak halus pada ilustrasi */
@keyframes apung{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes asapNaik{0%{opacity:0;transform:translateY(6px) scaleY(.85)}
  35%{opacity:.9}100%{opacity:0;transform:translateY(-14px) scaleY(1.15)}}
@keyframes goyang{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(6deg) translateY(-5px)}}
.sapa .apung1{animation:apung 5.5s ease-in-out infinite}
.sapa .apung2{animation:apung 7s ease-in-out infinite .8s}
.sapa .daun1{transform-origin:220px 88px;animation:goyang 4.5s ease-in-out infinite}
.sapa .daun2{transform-origin:52px 54px;animation:goyang 5.5s ease-in-out infinite .6s}
.sapa .asap .a1{animation:asapNaik 2.8s ease-out infinite}
.sapa .asap .a2{animation:asapNaik 2.8s ease-out infinite .55s}
.sapa .asap .a3{animation:asapNaik 2.8s ease-out infinite 1.1s}

/* ikon pada kepala kartu */
.card .hd h3{display:flex;align-items:center;gap:9px}
.ikon{width:26px;height:26px;border-radius:8px;display:inline-grid;place-items:center;flex:0 0 26px;
  transition:transform .2s}
.ikon svg{width:15px;height:15px}
.card:hover .ikon{transform:scale(1.12) rotate(-5deg)}

/* ---------- dashboard ---------- */
.dashAtas{display:grid;grid-template-columns:1.45fr 1fr;gap:16px;margin-bottom:16px}
.dashBawah{display:grid;grid-template-columns:1.75fr 1fr;gap:16px}

/* kartu besar komposisi */
.kartuUtama{padding:20px 22px}
.kartuUtama .kepala{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px}
.kartuUtama .lab{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--slate);font-weight:700}
.kartuUtama .angka{font-size:38px;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin-top:6px}
.kartuUtama .sub{font-size:12.5px;color:var(--slate);margin-top:7px}
.kartuUtama .kepala .btn{margin-left:auto;flex:0 0 auto}
.pitaB{display:flex;height:44px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.pitaB .seg{display:grid;place-items:center;color:#FFF;font-weight:700;font-size:12px;min-width:2px;
  transition:flex-grow .5s cubic-bezier(.4,0,.2,1),filter .14s}
.pitaB .seg:hover{filter:brightness(1.13)}
.pitaB .seg span{text-shadow:0 1px 2px rgba(0,0,0,.28)}
.legB{display:flex;flex-wrap:wrap;gap:7px 16px;margin-top:13px;font-size:12.5px;color:var(--slate)}
.legB span{display:flex;align-items:center}
.legB i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:7px}
.legB b{color:var(--ink);margin-left:5px}

/* ubin rincian di kartu besar */
.kartuUtama .ubin{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px;
  padding-top:18px;border-top:1px solid var(--line)}
.kartuUtama .ub{display:flex;align-items:center;gap:10px;min-width:0}
.kartuUtama .ub b{display:block;font-size:19px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.kartuUtama .ub span{font-size:11.5px;color:var(--slate)}
.kartuUtama .ub .ikon{width:32px;height:32px;flex:0 0 32px;border-radius:9px}
.kartuUtama .ub .ikon svg{width:17px;height:17px}
@media (max-width:640px){ .kartuUtama .ubin{grid-template-columns:repeat(2,1fr)} }

/* tiga kartu kecil berwarna */
.asetGrid{display:grid;grid-template-rows:repeat(3,1fr);gap:12px}
.aset{border-radius:var(--r);padding:14px 16px;border:1px solid transparent;display:flex;
  flex-direction:column;justify-content:center;transition:transform .15s,box-shadow .15s}
.aset .j{font-size:12px;font-weight:700;letter-spacing:.02em}
.aset .a{font-size:27px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:2px}
.aset .k{font-size:11.5px;opacity:.8;margin-top:3px}
.aset.emas{background:var(--gold-lt);border-color:#E4D2AC;color:#6E5320}
.aset.daun{background:var(--leaf-lt);border-color:#C3DDB6;color:#38612A}
.aset.biru{background:var(--sky-lt);border-color:#BFD8EC;color:#14406B}
.aset .atas{display:flex;align-items:flex-start;gap:10px}
.aset .atas .j{flex:1}
.aset .ikonAset{width:22px;height:22px;opacity:.55;flex:0 0 22px;transition:transform .25s,opacity .25s}
.aset .mini{height:5px;border-radius:4px;background:rgba(0,0,0,.09);overflow:hidden;margin:8px 0 6px}
.aset .mini i{display:block;height:100%;border-radius:4px;background:currentColor;opacity:.65;
  transition:width .8s cubic-bezier(.22,.8,.3,1)}
.aset.bisa{cursor:pointer}
.aset.bisa:hover{transform:translateY(-2px);box-shadow:0 8px 20px -10px rgba(6,29,66,.3)}
.aset:hover .ikonAset{transform:scale(1.15) rotate(-6deg);opacity:.85}

/* daftar sekolah */
.gulirSek{max-height:352px;overflow-y:auto}
.gulirSek thead th{position:sticky;top:0;z-index:2}
.tblSek td{padding:9px 12px}
.tblSek .nm{font-weight:600}
.tblSek .kosong{color:var(--line)}
.tblSek tbody tr[data-sek]{cursor:pointer}
.tblSek tbody tr[data-sek]:hover td{background:var(--sky-lt)}
.tblSek tbody tr[data-sek] .btn{opacity:0;transition:opacity .14s}
.tblSek tbody tr[data-sek]:hover .btn,.tblSek tbody tr[data-sek]:focus-within .btn{opacity:1}

/* kartu gelap tindakan cepat */
.gelapKartu{background:var(--navy-dk);border-color:var(--navy-dk);color:#D8E6F0;overflow:hidden;position:relative}
.gelapKartu .isi{padding:22px}
.gelapKartu h4{font-size:20px;font-weight:800;color:#FFF;line-height:1.25;letter-spacing:-.02em}
.gelapKartu p{font-size:12.5px;color:#A5BDD6;margin-top:9px;line-height:1.6}
.gelapKartu .tbl{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.gelapKartu .tbl .btn.ghost{background:transparent;color:#D8E6F0;border-color:rgba(255,255,255,.28)}
.gelapKartu .tbl .btn.ghost:hover{background:rgba(255,255,255,.1)}
.gelapKartu .pering{margin-top:18px;background:rgba(201,130,43,.18);border:1px solid rgba(224,203,154,.4);
  color:#F0D9AE;border-radius:9px;padding:10px 12px;font-size:12.5px;line-height:1.6}
.gelapKartu .pering button{color:#FFF;text-decoration:underline;font-size:12.5px;font-weight:700}
.gelapKartu .aman{margin-top:18px;background:rgba(95,155,71,.16);border:1px solid rgba(122,190,96,.35);
  color:#BFE3AE;border-radius:9px;padding:10px 12px;font-size:12.5px;line-height:1.6}
.gelapKartu .isi{position:relative;z-index:2}
.gelapKartu .ilus{position:absolute;right:-18px;bottom:-14px;width:210px;height:170px;
  opacity:.5;pointer-events:none;z-index:1}
@media (max-width:1080px){ .gelapKartu .ilus{opacity:.32} }

/* hiasan halus pada kartu besar */
.kartuUtama{position:relative;overflow:hidden}
.kartuUtama::after{content:'';position:absolute;right:-70px;top:-70px;width:200px;height:200px;
  border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--sky-lt),transparent 70%);
  pointer-events:none}

@media (max-width:1080px){
  .dashAtas,.dashBawah{grid-template-columns:1fr}
  .asetGrid{grid-template-rows:none;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px}
.kpi .lab{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--slate);font-weight:600}
.kpi .val{font-size:31px;font-weight:800;letter-spacing:-.035em;margin-top:8px;line-height:1}
.kpi .cap{font-size:12px;color:var(--slate);margin-top:6px}
.kpi.accent{border-left:3px solid var(--navy)}
.kpi.accent2{border-left:3px solid var(--gold)}
.kpi.accent3{border-left:3px solid var(--sky)}

.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}

.bars{display:flex;flex-direction:column;gap:11px}
.brow{display:grid;grid-template-columns:118px 1fr 54px;align-items:center;gap:11px;font-size:13px}
.brow .nm{color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .tr{height:9px;border-radius:5px;background:var(--mist);overflow:hidden}
.brow .fl{height:100%;border-radius:5px;background:var(--navy);transition:width .6s cubic-bezier(.4,0,.2,1)}
.brow .n{text-align:right;font-weight:700}
.brow.klikbar{cursor:pointer;border-radius:7px;padding:3px 6px;margin:-3px -6px;transition:background .14s}
.brow.klikbar:hover{background:var(--sky-lt)}
.brow.klikbar:hover .nm{color:var(--navy)}

/* kepala tabel yang bisa diurutkan */
th.urut{cursor:pointer;user-select:none;transition:background .14s}
th.urut:hover{background:#E6ECF2}
th.urut .ar{margin-left:6px;font-size:9px;color:var(--navy)}
th.urut .ar.dim{color:var(--line)}
th.urut:hover .ar.dim{color:var(--slate)}
.tblData tbody tr[data-buka]{cursor:pointer}

.kpi.klik{cursor:pointer;transition:box-shadow .15s,transform .15s}
.kpi.klik:hover{box-shadow:0 6px 18px -8px rgba(6,29,66,.32);transform:translateY(-1px);border-color:var(--navy)}
.kpi .klikhint{font-size:11px;color:var(--navy);font-weight:700;margin-top:8px;opacity:.75}
.kpi.klik:hover .klikhint{opacity:1}

/* pita komposisi */
.ribbon{margin-bottom:18px}
.ribbon .bar{display:flex;height:46px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.ribbon .seg{position:relative;display:grid;place-items:center;color:#FFF;font-weight:700;font-size:12px;
  transition:flex-grow .5s cubic-bezier(.4,0,.2,1),filter .14s;min-width:2px;cursor:default}
.ribbon .seg:hover{filter:brightness(1.12)}
.ribbon .seg span{opacity:.95;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.ribbon .key{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px}
.ribbon .key i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:7px}
.ribbon .key div{font-size:12.5px;display:flex;align-items:center;color:var(--slate)}
.ribbon .key b{color:var(--ink);margin-left:6px;font-weight:700}

/* umpan balik tekan pada tombol *//* umpan balik tekan pada tombol *//* umpan balik tekan pada tombol *//* umpan balik tekan pada tombol */
.btn:active{transform:translateY(1px)}
.nav button:active{transform:translateY(1px)}
/* pergantian halaman dan kemunculan kartu */
@keyframes masuk{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes naik{from{opacity:0;transform:translateY(14px) scale(.995)}to{opacity:1;transform:none}}
.masukAnim{animation:naik .38s cubic-bezier(.22,.8,.3,1) both}
.pitaB .seg{flex:0 0 auto}
.brow .fl,.prow .b{transition:width .75s cubic-bezier(.22,.8,.3,1)}
.pitaB .seg{transition:width .7s cubic-bezier(.22,.8,.3,1),filter .14s}
.card{transition:box-shadow .18s,border-color .18s}
.grid2 .card:hover,.grid3 .card:hover{box-shadow:0 10px 26px -14px rgba(6,29,66,.34);border-color:#C3D3E0}
.ilusKosong{width:220px;height:140px;margin:0 auto 14px;display:block}
@media (prefers-reduced-motion:reduce){
  .brow .fl,.prow .b,.pitaB .seg{transition:none}
  .masukAnim{animation:none}
  .sapa .apung1,.sapa .apung2,.sapa .daun1,.sapa .daun2,.sapa .asap path{animation:none}
}

/* piramida usia */
.pyr{display:flex;flex-direction:column;gap:5px}
.prow{display:grid;grid-template-columns:1fr 62px 1fr;align-items:center;gap:9px;font-size:12px}
.prow .lft{display:flex;justify-content:flex-end}
.prow .rgt{display:flex}
.prow .b{height:17px;border-radius:4px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.prow .lft .b{background:var(--sky)} .prow .rgt .b{background:var(--rose)}
.prow .age{text-align:center;color:var(--slate);font-weight:600;font-size:11.5px}
.prow .qt{font-size:11px;color:var(--slate);padding:0 6px;align-self:center}

/* ---------- tabel ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .search{flex:1;min-width:210px;position:relative}
.toolbar .search input{padding-left:33px}
.toolbar .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.4}
.toolbar select{width:auto;min-width:132px;max-width:250px}
.tablewrap{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.scroller{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{
  background:var(--mist);text-align:left;padding:10px 12px;font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--slate);font-weight:700;white-space:nowrap;border-bottom:1px solid var(--line)
}
thead th.r{text-align:right} thead th.c{text-align:center}

/* ---------- tabel rincian per sekolah ---------- */
.rinci{font-size:12.5px}
.rinci thead th{padding:7px 8px;font-size:10px;letter-spacing:.04em;text-align:right;white-space:nowrap}
.rinci thead th.c{text-align:center}
.rinci thead th.kiri{text-align:left}
.rinci thead th.kecil{font-size:9.5px;padding:5px 8px;background:#EDF2F7;color:var(--slate)}
.rinci thead tr.pita th{background:var(--navy-dk);color:#FFF;font-size:9.5px;letter-spacing:.09em;
  border-bottom:1px solid rgba(255,255,255,.18)}
.rinci thead tr.pita th.kiri{background:var(--navy-dk)}
.rinci thead tr:nth-child(2) th{background:var(--navy);color:#FFF}
.rinci tbody th[scope=row]{text-align:left;font-weight:600;padding:7px 10px;
  border-bottom:1px solid var(--line);white-space:nowrap;max-width:230px;overflow:hidden;text-overflow:ellipsis}
.rinci tbody td{padding:7px 9px;font-size:12.5px}
.rinci tbody tr:nth-child(even) td{background:#FAFCFE}
.rinci tbody tr:hover td{background:var(--sky-lt)}
.rinci .sekat{border-left:2px solid var(--slate)}
.rinci thead th.sekat{border-left:2px solid rgba(255,255,255,.45)}
/* kisi penuh: tiap sel punya garis bantu di semua sisi */
.rinci tbody td,.rinci tbody th[scope=row]{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.rinci thead th{border-right:1px solid rgba(255,255,255,.22);border-bottom:1px solid rgba(255,255,255,.22)}
.rinci thead th.kecil{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.rinci thead th:last-child,.rinci tbody td:last-child{border-right:0}
/* pemisah tegas antara nama sekolah dan kolom angka */
.rinci tbody th[scope=row]{border-right:2px solid var(--slate)}
.rinci thead th:first-child{border-right:2px solid rgba(255,255,255,.45)}
/* garis bantu mendatar lebih tegas tiap kelompok tiga baris */
.rinci tbody tr:nth-child(3n) td,.rinci tbody tr:nth-child(3n) th[scope=row]{
  border-bottom:1px solid var(--slate)}
.rinci tbody tr.jml th,.rinci tbody tr.jml td{border-right-color:rgba(255,255,255,.28)}
.rinci tbody tr.jml th[scope=row]{border-right:2px solid rgba(255,255,255,.5)}

/* kolom nama sekolah menempel saat tabel digeser ke samping */
.rinci th:first-child,.rinci td:first-child{position:sticky;left:0;z-index:2;
  background:var(--paper);box-shadow:2px 0 0 -1px var(--line)}
.rinci thead th:first-child{z-index:4}
.rinci tbody tr:nth-child(even) th:first-child{background:#FAFCFE}
.rinci tbody tr:hover th:first-child{background:var(--sky-lt)}
.rinci tbody tr.jml th,.rinci tbody tr.jml td{background:var(--navy)!important;color:#FFF;
  font-weight:800;border-bottom:0;padding:9px}
.rinci tbody tr.jml .sekat{border-left-color:rgba(255,255,255,.25)}
thead tr:first-child th[colspan]{border-left:1px solid var(--line);border-right:1px solid var(--line)}
thead th[rowspan]{vertical-align:bottom}
tbody td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
/* garis bantu vertikal supaya kolom mudah diikuti */
tbody td{border-right:1px solid var(--line)}
tbody td:last-child{border-right:0}
thead th{border-right:1px solid var(--line)}
thead th:last-child{border-right:0}
tbody tr:hover{background:#F8FBFD}
td.nama{font-weight:600;max-width:210px;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.tag.g{background:var(--navy-lt);color:var(--navy-dk)}
.tag.a{background:var(--gold-lt);color:#6E5320}
.tag.b{background:var(--sky-lt);color:#14406B}
.tag.r{background:var(--rose-lt);color:#7E2B25}
.rowact{display:flex;gap:5px}
.rowact button{padding:4px 9px;border-radius:6px;font-size:12px;border:1px solid var(--line);color:var(--slate)}
.rowact button:hover{background:var(--mist);color:var(--ink)}
.pager{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--slate);flex-wrap:wrap}
.pager .sp{flex:1}
.pager button{padding:5px 11px;border:1px solid var(--line);border-radius:7px;font-size:12.5px}
.pager button:disabled{opacity:.4;cursor:default}
.empty{padding:56px 24px;text-align:center;color:var(--slate)}
.empty h4{font-size:15px;color:var(--ink);margin-bottom:6px;font-weight:700}
input[type=checkbox]{accent-color:var(--navy);width:15px;height:15px;cursor:pointer}
.selbar{display:flex;align-items:center;gap:10px;background:var(--navy-dk);color:#FFF;padding:10px 14px;border-radius:9px;margin-bottom:12px;font-size:13px;flex-wrap:wrap}
.selbar .sp{flex:1}
.selbar button{padding:5px 12px;border-radius:7px;font-size:12.5px;font-weight:600;border:1px solid rgba(255,255,255,.3);color:#FFF}
.selbar button:hover{background:rgba(255,255,255,.12)}
.selbar button.del{background:var(--rose);border-color:var(--rose)}
.grp{display:flex;flex-direction:column;gap:7px}
.grp .g{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--line);border-radius:8px}
.grp .g input{flex:1;min-width:0}
.grp .g .n{font-size:12px;color:var(--slate);white-space:nowrap;font-weight:700;min-width:56px;text-align:right}
.grp .g button{padding:4px 10px;border:1px solid var(--rose);color:var(--rose);border-radius:7px;font-size:12px;font-weight:600;white-space:nowrap}
.grp .g button:hover{background:var(--rose);color:#FFF}

/* ---------- modal ---------- */
.veil{position:fixed;inset:0;background:rgba(15,31,26,.5);display:none;z-index:60;align-items:center;justify-content:center;padding:18px}
.veil.on{display:flex}
.modal{background:var(--paper);border-radius:14px;width:100%;max-width:660px;max-height:88dvh;display:flex;flex-direction:column;overflow:hidden}
.modal .mh{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal .mh h3{font-size:16px;font-weight:800;flex:1}
.modal .mb{padding:20px;overflow-y:auto}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;background:var(--mist)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid .full{grid-column:1/-1}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(140%);background:var(--ink);color:#FFF;
  padding:11px 20px;border-radius:9px;font-size:13.5px;font-weight:500;z-index:80;transition:transform .3s;max-width:90vw}
.toast.on{transform:translateX(-50%) translateY(0)}

.steps{display:flex;flex-direction:column;gap:16px}
.map{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.map .row{display:flex;align-items:center;gap:9px}
.map .row .k{flex:0 0 118px;font-size:12px;font-weight:600;color:var(--slate)}
.hint{background:var(--navy-lt);border-left:3px solid var(--navy);padding:11px 14px;border-radius:7px;font-size:12.5px;color:var(--navy-dk);line-height:1.6}
.warn{background:var(--gold-lt);border-left:3px solid var(--gold);padding:11px 14px;border-radius:7px;font-size:12.5px;color:#7A4E0B;line-height:1.6}

@media (max-width:900px){
  .grid2,.grid3{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
}
@media (max-width:720px){
  .shell{flex-direction:column}
  .sidebar{width:100%;flex:none;height:auto;position:static;flex-direction:row;align-items:center;padding:10px 12px;gap:12px;overflow-x:auto}
  .brand p,.sidefoot,.nav .cap{display:none}
  .nav{flex-direction:row;gap:5px}
  .nav button{white-space:nowrap;padding:7px 12px}
  .sync{border:0;padding:0;margin-left:auto}
  .topbar{padding:13px 16px} .page{padding:16px 14px 50px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

async function api(action, dataset, payload){
  if(!store.cfg.url){
    if(DEMO) return localApi(action, dataset, payload);
    throw new Error('URL Apps Script belum diisi di Pengaturan.');
  }
  setSync('busy','Menyinkronkan…');
  const res = await fetch(store.cfg.url,{
    method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action,dataset,payload,token:store.cfg.token})
  });
  const j = await res.json();
  if(!j.ok){ setSync('err','Gagal'); throw new Error(j.error||'Permintaan ditolak'); }
  setSync('ok','Tersinkron '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}));
  return j.data;
}
/** Salinan operasi backend untuk mode contoh — tanpa Google Sheets. */
function localApi(action, dataset, payload){
  const uid = ()=> 'X'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  if(action==='listAll') return {sekolah:store.sekolah, tigab:store.tigab,
                                 master:store.master, master3b:store.master3b};
  if(action==='list') return store[dataset];
  if(action==='remove'){
    const t = new Set(payload);
    store[dataset] = store[dataset].filter(r=>!t.has(r.id));
  }
  if(action==='save'){
    payload.forEach(row=>{
      const i = row.id ? store[dataset].findIndex(r=>r.id===row.id) : -1;
      if(i>=0) store[dataset][i] = Object.assign({}, store[dataset][i], row);
      else store[dataset].push(Object.assign({}, row, {id: row.id||uid()}));
    });
  }
  if(action==='replaceAll'){
    store[dataset] = (dataset==='master' || dataset==='master3b')
      ? payload.map(r=>Object.assign({}, r))
      : payload.map(r=>Object.assign({}, r, {id: r.id||uid()}));
  }
  persist();
  setSync('','Mode contoh — belum tersambung');
  return {};
}

async function pull(){
  const d = await api('listAll');

  })).filter(r=>r.nama);
  if(m.length){
    store.master = m;
  }else if(store.cfg.url && store.master.length){
    await api('replaceAll','master',store.master);  // kirim data awal ke sheet
  }
  const m3 = (d.master3b||[]).map(r=>({nama:r.nama, desa:r.desa, sasaran:+r.sasaran||0}))
    .filter(r=>r.nama);
  if(m3.length) store.master3b = m3;

  cekDuplikat(true);
}

/* =========================================================
   Utilitas data
   ========================================================= */
function parseDate(v){
  if(v===null || v===undefined || v==='') return null;
  const s = String(v).trim();
  /* nomor seri Excel — muncul kalau sel tanggal tersimpan sebagai angka polos */
  if(/^\d{5}(\.\d+)?$/.test(s)){
    const n = parseFloat(s);
    if(n>10000 && n<80000){
      const d = new Date(Date.UTC(1899,11,30) + n*86400000);
      return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
    }
  }
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
  if(m) return new Date(+m[3], +m[2]-1, +m[1]);
  const d = new Date(s); return isNaN(d) ? null : d;
}
/** Umur terhadap hari ini: tahun, bulan, dan teks siap tampil. */
function umurDetail(v){
  const d = parseDate(v); if(!d) return null;
  const n = new Date();
  let th = n.getFullYear()-d.getFullYear();
  let bl = n.getMonth()-d.getMonth();
  if(n.getDate() < d.getDate()) bl--;
  if(bl<0){ th--; bl+=12; }
  if(th<0 || th>130) return null;
  const teks = th<1 ? bl+' bln' : th<6 ? th+' th '+bl+' bln' : th+' th';
  return {tahun:th, bulan:bl, bulanTotal:th*12+bl, teks:teks};
}
function umur(v){ const u = umurDetail(v); return u ? u.tahun : null; }
/** Seragamkan tanggal apa pun jadi dd/mm/yyyy. */
function normTanggal(v){
  const d = parseDate(v); if(!d) return String(v||'').trim();
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
}
function keISO(v){
  const d = parseDate(v); if(!d) return '';
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
/** Seragamkan istilah peran dari berbagai penulisan di berkas BNBA. */
function normPeran(v){
  const s = String(v||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  if(!s) return '';
  // tendik diperiksa lebih dulu: "tenaga kependidikan" mengandung kata "pendidik"
  if(/\b(tendik|tenaga kependidikan|kependidikan|tenaga administrasi|tata usaha|tu|staf|staff|operator|admin|administrasi|pustakawan|penjaga|pesuruh|satpam|security|kebersihan|cleaning|laboran|bendahara|kepala tata usaha)\b/.test(s)) return 'Tendik';
  if(/\b(guru|pendidik|pengajar|gr|kepala sekolah|kepsek|kamad|wali kelas|ustadz|ustadzah|ustaz|ustazah|mudarris|pembina|pengasuh)\b/.test(s)) return 'Guru';
  if(/\b(siswa|murid|peserta didik|pd|anak didik|santri|santriwan|santriwati|pelajar|warga belajar|anak)\b/.test(s)) return 'Siswa';
  return '';
}
function normPorsi(v){
  const s = String(v||'').toLowerCase().trim();
  if(!s) return '';
  if(/kecil|\bk\b|small/.test(s)) return 'Kecil';
  if(/besar|\bb\b|large/.test(s)) return 'Besar';
  return '';
}
function normJK(v){
  const s = String(v||'').trim().toUpperCase();
  if(s.startsWith('L') || s==='M' || s.includes('LAKI')) return 'L';
  if(s.startsWith('P') || s==='F' || s.includes('PEREMPUAN')) return 'P';
  return '';
}
function uniq(arr, key){
  return [...new Set(arr.map(r=>String(r[key]||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'id'));
}
function rows(ds){
  const q = store.q[ds].toLowerCase().trim();
  const f = store.filter[ds];
  const hasil = store[ds].filter(r=>{
    if(f._nisn){
      const ada = String(r.nisn||'').trim()!=='';
      if(f._nisn==='Sudah ada NISN' && !ada) return false;
      if(f._nisn==='NISN belum ada' && ada) return false;
    }
    if(f._umur){
      const u = umurDetail(r.tgl_lahir);
      if(f._umur==='Tanggal lahir kosong'){ if(u) return false; }
      else if(!u) return false;
      else if(f._umur==='Baduta (< 2 th)'      && u.tahun>=2) return false;
      else if(f._umur==='Balita (< 5 th)'      && u.tahun>=5) return false;
      else if(f._umur==='Usia SD (6–12 th)'    && (u.tahun<6 || u.tahun>12)) return false;
      else if(f._umur==='Usia SMP (13–15 th)'  && (u.tahun<13 || u.tahun>15)) return false;
      else if(f._umur==='Usia SMA (16–18 th)'  && (u.tahun<16 || u.tahun>18)) return false;
      else if(f._umur==='Dewasa (19+ th)'      && u.tahun<19) return false;
    }
    for(const k in f){ if(k[0]==='_') continue; if(f[k] && String(r[k]||'').trim() !== f[k]) return false; }
    if(!q) return true;
    return (r.nama+' '+r.nik+' '+(r.nisn||'')+' '+(r.sekolah||'')+' '+(r.desa||'')+' '+(r.wali||'')).toLowerCase().includes(q);
  });
  return urutkanBaris(hasil, store.sort[ds]);
}

/** Nilai pembanding untuk pengurutan kolom. */
function nilaiUrut(r, kol){
  if(kol==='umur'){ const u = umurDetail(r.tgl_lahir); return u ? u.bulanTotal : -1; }
  if(kol==='tgl_lahir'){ const d = parseDate(r.tgl_lahir); return d ? d.getTime() : 0; }
  return String(r[kol]==null ? '' : r[kol]);
}
function urutkanBaris(arr, s){
  if(!s || !s.kol) return arr;
  const salin = arr.slice();
  salin.sort((a,b)=>{
    const x = nilaiUrut(a, s.kol), y = nilaiUrut(b, s.kol);
    let c;
    if(typeof x === 'number' && typeof y === 'number') c = x - y;
    else c = String(x).localeCompare(String(y), 'id', {numeric:true, sensitivity:'base'});
    if(c === 0) c = String(a.nama||'').localeCompare(String(b.nama||''), 'id');
    return c * s.arah;
  });
  return salin;
}

/** Tentukan porsi otomatis. Di PAUD/TK semua ikut porsi kecil, termasuk guru dan tendik. */
function porsiOtomatis(r){
  const j = String(r.jenjang||'').trim();
  if(j==='PAUD/TK') return 'Kecil';
  const peran = String(r.peran||'Siswa').trim();
  if(peran==='Guru' || peran==='Tendik') return 'Besar';
  if(j==='SMP/MTs' || j==='SMA/MA') return 'Besar';
  const k = parseInt(r.kelas);
  if(!isNaN(k)) return k<=3 ? 'Kecil' : 'Besar';
  return '';
}
/** Rincian porsi satu sekolah menurut master. */
function porsiSekolah(m){
  const kecil=+m.kecil||0, besar=+m.besar||0, guru=+m.guru||0, tendik=+m.tendik||0;
  const staf = guru+tendik;
  const stafKecil = String(m.jenjang||'').trim()==='PAUD/TK';
  return {
    kecil: kecil + (stafKecil?staf:0),
    besar: besar + (stafKecil?0:staf),
    siswa: kecil+besar, guru, tendik, staf,
    total: kecil+besar+staf
  };
}
function lengkapiSekolah(r){
  if(!String(r.peran||'').trim()) r.peran = 'Siswa';
  if(!String(r.jenjang||'').trim()){
    const m = store.master.find(x=>x.nama===String(r.sekolah||'').trim());
    if(m) r.jenjang = m.jenjang;
  }
  if(!String(r.porsi||'').trim()) r.porsi = porsiOtomatis(r);
  if(!String(r.desa||'').trim()){
    const m = store.master.find(x=>x.nama===String(r.sekolah||'').trim());
    if(m && m.desa) r.desa = m.desa;
  }
  return r;
}
/** Sasaran harian menurut master: porsi kecil, porsi besar, dan rinciannya. */
function targetMaster(list){
  const t = {kecil:0, besar:0, siswa:0, guru:0, tendik:0, total:0};
  (list||store.master).forEach(m=>{
    const p = porsiSekolah(m);
    t.kecil += p.kecil; t.besar += p.besar; t.siswa += p.siswa;
    t.guru += p.guru; t.tendik += p.tendik;
  });
  t.total = t.kecil + t.besar;
  return t;
}
/** Apakah ada sasaran pembanding yang diisi di master? */
function adaSasaran(){
  return store.master.some(m=>(+m.kecil||0)+(+m.besar||0)+(+m.guru||0)+(+m.tendik||0) > 0);
}

/* ---------- realisasi: dihitung dari data BNBA yang diunggah ---------- */

/** Hitung isi BNBA satu sekolah, atau seluruhnya bila nama diisi null. */
function hitungSekolah(nama){
  const o = {kecil:0, besar:0, siswa:0, guru:0, tendik:0, staf:0, total:0, L:0, P:0, desa:{}};
  store.sekolah.forEach(r=>{
    if(nama!=null && String(r.sekolah||'').trim()!==nama) return;
    const porsi = String(r.porsi||'').trim() || porsiOtomatis(r);
    if(porsi==='Kecil') o.kecil++; else if(porsi==='Besar') o.besar++;
    const peran = String(r.peran||'Siswa').trim();
    if(peran==='Guru') o.guru++; else if(peran==='Tendik') o.tendik++; else o.siswa++;
    const g = normJK(r.jk); if(g==='L') o.L++; else if(g==='P') o.P++;
    const d = String(r.desa||'').trim(); if(d) o.desa[d]=(o.desa[d]||0)+1;
    o.total++;
  });
  o.staf = o.guru + o.tendik;
  return o;
}
/** Rekap kelompok 3B menurut kategori dan desa, seluruhnya dari data BNBA. */
function target3B(){
  const t = {total:0, perDesa:{}, perKat:{}, matrix:{}, lain:0};
  desaTersedia().forEach(d=>t.perDesa[d]=0);
  KAT3B.forEach(k=>{ t.perKat[k]=0; t.matrix[k]={}; desaTersedia().forEach(d=>t.matrix[k][d]=0); });
  store.tigab.forEach(r=>{
    const k = String(r.kategori||'').trim(), d = String(r.desa||'').trim();
    t.total++;
    if(t.perKat[k]!==undefined) t.perKat[k]++; else t.lain++;
    if(t.perDesa[d]!==undefined) t.perDesa[d]++;
    if(t.matrix[k] && t.matrix[k][d]!==undefined) t.matrix[k][d]++;
  });
  return t;
}

/** Angka KPI naik dari nol — dilewati bila pengguna meminta gerak minimal. */
function animasiAngka(){
  if(typeof requestAnimationFrame !== 'function') return;
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('#page .kpi .val, #page .kartuUtama .angka, #page .aset .a').forEach(elm=>{
    const target = parseInt(String(elm.textContent).replace(/\D/g,''), 10);
    if(!target || target < 5) return;
    const mulai = performance.now(), lama = 520;
    const jalan = t => {
      const p = Math.max(0, Math.min(1, (t - mulai) / lama));
      const e = 1 - Math.pow(1 - p, 3);
      elm.textContent = num(Math.round(target * e));
      if(p < 1) requestAnimationFrame(jalan);
    };
    elm.textContent = '0';
    requestAnimationFrame(jalan);
  });
}

function render(){
  const p = $('#page'); p.innerHTML='';
  if(store.view==='dash') p.append(viewDash());
  else if(store.view==='rincian') p.append(viewRincian());

  else if(store.view==='set') p.append(viewSet());

  cekDuplikat(false);

}

  };
  if(diam || typeof requestAnimationFrame !== 'function'){ isi(); return; }
  requestAnimationFrame(()=>requestAnimationFrame(isi));

  /* kartu muncul berurutan — anak dari pembungkus halaman */
  const induk = document.querySelector('#page > *');
  const anak = induk ? [...induk.children] : [];
  anak.forEach((x,i)=>{
    if(i > 9) return;
    x.classList.add('masukAnim');
    x.style.setProperty('animation-delay', (i*55)+'ms');
  });
}

        ' tendik · '+num(t3.total)+' kelompok 3B</div></div>'+
      '<button class="btn ghost sm" id="keRincian">Rincian →</button></div>'+
    '<div class="pitaB">'+comp.map(([k,n])=>{
        const p = n/compTotal*100;
        return '<div class="seg" data-lebar="'+p+'%" style="width:0;background:'+(COLORS[k]||'#8494A8')+'"'+
          ' title="'+esc(k)+': '+num(n)+' jiwa">'+(p>8?'<span>'+Math.round(p)+'%</span>':'')+'</div>';
      }).join('')+'</div>'+
    '<div class="legB">'+comp.map(([k,n])=>
        '<span><i style="background:'+(COLORS[k]||'#8494A8')+'"></i>'+esc(k)+' <b class="mono">'+num(n)+'</b></span>'
      ).join('')+'</div>'+
    '<div class="ubin">'+
      ubin('siswa','Siswa', R.siswa, '#2F6DA0')+
      ubin('guru','Guru', R.guru, '#9D7C38')+
      ubin('tendik','Tendik', R.tendik, '#5F9B47')+
      ubin('tigab','Kelompok 3B', t3.total, '#B0433C')+
    '</div>';
  utama.querySelector('#keRincian').onclick = ()=>go('rincian');
  atas.append(utama);

  /* tiga kartu kecil berwarna */
  const aset = el('div','asetGrid');
  const kartuAset = (kelas, judul, angka, kaki, bagian, gbr, aksi) => {
    const d = el('div','aset '+kelas);
    d.innerHTML = '<div class="atas"><div class="j">'+judul+'</div>'+gbr+'</div>'+
      '<div class="a mono">'+num(angka)+'</div>'+
      '<div class="mini"><i data-lebar="'+Math.round(bagian)+'%" style="width:0"></i></div>'+
      '<div class="k">'+kaki+'</div>';
    if(aksi){ d.classList.add('bisa'); d.onclick = aksi; }
    return d;
  };
  const totPorsi = (R.kecil + R.besar) || 1;
  const ket3B = KAT3B.filter(k=>t3.perKat[k]).map(k=>esc(k)+' '+num(t3.perKat[k])).join(' · ')
    || (t3.total ? '<span style="color:var(--rose)">kategori belum terisi — perbaiki lewat Kelompok 3B</span>'
                 : 'belum ada data');
  aset.append(
    kartuAset('emas','Porsi kecil', R.kecil, 'PAUD/TK &amp; SD kelas 1–3',
      R.kecil/totPorsi*100, ikonAset('kecil'), ()=>lihat('sekolah','porsi','Kecil')),
    kartuAset('daun','Porsi besar', R.besar, 'SD kelas 4–6 ke atas',
      R.besar/totPorsi*100, ikonAset('besar'), ()=>lihat('sekolah','porsi','Besar')),
    kartuAset('biru','Kelompok 3B', t3.total, ket3B,
      t3.total/(totalPM||1)*100, ikonAset('tigab'), ()=>go('tigab'))
  );
  atas.append(aset);
  wrap.append(atas);

  /* ================= baris bawah ================= */
  const bawah = el('div','dashBawah');

  /* daftar sekolah */
  const cs = el('div','card');
  cs.innerHTML = '<div class="hd"><h3>Daftar sekolah</h3>'+
    '<div class="note">'+num(store.master.length)+' satuan pendidikan</div><div style="flex:1"></div>'+
    '<button class="btn ghost sm" id="keDaftar">Lihat semua →</button></div>';
  let t = '<div class="scroller gulirSek"><table class="tblSek"><thead><tr>'+
    '<th>Sekolah</th><th style="width:92px">Jenjang</th>'+
    '<th style="width:76px;text-align:right">Kecil</th>'+
    '<th style="width:76px;text-align:right">Besar</th>'+
    '<th style="width:76px;text-align:right">Total</th>'+
    '<th style="width:84px"></th></tr></thead><tbody>';
  store.master.forEach(m=>{
    const p = hitungSekolah(m.nama);
    t += '<tr data-sek="'+esc(m.nama)+'">'+
      '<td class="nm">'+esc(m.nama)+'</td>'+
      '<td><span class="tag g">'+esc(m.jenjang||'—')+'</span></td>'+
      '<td class="mono" style="text-align:right">'+(p.kecil?num(p.kecil):'<span class="kosong">·</span>')+'</td>'+
      '<td class="mono" style="text-align:right">'+(p.besar?num(p.besar):'<span class="kosong">·</span>')+'</td>'+
      '<td class="mono" style="text-align:right;font-weight:700">'+(p.total?num(p.total):'<span class="kosong">·</span>')+'</td>'+
      '<td><button class="btn ghost sm" data-unduh="'+esc(m.nama)+'">Unduh</button></td></tr>';
  });
  t += '</tbody></table></div>';
  const b = el('div'); b.innerHTML = t; cs.append(b);
  cs.querySelector('#keDaftar').onclick = ()=>go('daftar');
  b.querySelectorAll('tr[data-sek]').forEach(tr=>tr.onclick = e=>{
    if(e.target.closest('button')) return; lihat('sekolah','sekolah',tr.dataset.sek);
  });
  b.querySelectorAll('[data-unduh]').forEach(x=>x.onclick = ()=>openUnduh(x.dataset.unduh));
  bawah.append(cs);

  /* kartu gelap: tindakan cepat */
  const aksi = el('div','card gelapKartu');
  const nDup = jumlahDuplikat();
  const nLuar = (S.length||T.length) ? dataLuarMaster().reduce((s,g)=>s+g.ids.length,0) : 0;
  aksi.innerHTML =
    '<div class="isi">'+
      '<h4>Kelola data<br>penerima manfaat</h4>'+
      '<p>Unggah BNBA dari Excel, atau unduh laporan dalam format resmi BGN.</p>'+
      '<div class="tbl"><button class="btn" id="aksiImpor">Impor data</button>'+
        '<button class="btn ghost" id="aksiUnduh">Unduh laporan</button></div>'+
      ((nDup||nLuar)
        ? '<div class="pering"><b>Perlu ditangani:</b> '+
          [nDup?num(nDup)+' NIK/NISN ganda':'', nLuar?num(nLuar)+' di luar master':''].filter(Boolean).join(' · ')+
          ' <button id="aksiTangani">Periksa →</button></div>'
        : '<div class="aman">Data bersih — tidak ada nomor ganda maupun baris di luar master.</div>')+
    '</div>'+ gambarOmpreng();
  aksi.querySelector('#aksiImpor').onclick = ()=>{ go('impor'); openImpor(); };
  aksi.querySelector('#aksiUnduh').onclick = ()=>openUnduh();
  const bt = aksi.querySelector('#aksiTangani');
  if(bt) bt.onclick = ()=>go('daftar');
  bawah.append(aksi);
  wrap.append(bawah);

  /* ================= grafik rinci ================= */
  const g2 = el('div','grid2'); g2.style.marginTop = '16px';
  const perSekolah = tally(S,'sekolah').filter(x=>x[0]!=='(tidak diisi)');
  g2.append(cardBars('Penerima per satuan pendidikan', perSekolah, R.total, 12,
    'Belum ada data siswa. Unggah BNBA lewat menu Impor & unduh.', null,
    nm=>lihat('sekolah','sekolah',nm)));
  const katData = KAT3B.map(k=>[k, t3.perKat[k]]).filter(x=>x[1]);
  g2.append(cardBars('Kelompok 3B per kategori', katData, t3.total, 6,
    'Belum ada data 3B.', k=>COLORS[k], k=>lihat('tigab','kategori',k)));
  wrap.append(g2);

  const g3 = el('div','grid3');
  g3.append(card3BDesa(t3));
  g3.append(cardGender([...S,...T]));
  g3.append(cardPyramid([...S,...T]));
  wrap.append(g3);

  hiasKartu(wrap);
  return wrap;
}

/** Ikon kecil untuk kepala kartu, dipilih dari kata pada judulnya. */
function ikonKartu(judul){
  const t = judul.toLowerCase();
  const bungkus = (isi, warna) => '<span class="ikon" style="background:'+warna+'22;color:'+warna+'">'+
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" '+
    'stroke-linecap="round" stroke-linejoin="round">'+isi+'</svg></span>';
  if(t.includes('satuan pendidikan') || t.includes('sekolah'))
    return bungkus('<path d="M3 21h18M5 21V9l7-5 7 5v12"/><path d="M9 21v-6h6v6"/>', '#2F6DA0');
  if(t.includes('3b') && t.includes('desa'))
    return bungkus('<path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/>', '#5F9B47');
  if(t.includes('3b'))
    return bungkus('<path d="M20.8 8.6a4.6 4.6 0 0 0-8.8-1.9A4.6 4.6 0 0 0 3.2 8.6c0 4.6 8.8 10 8.8 10s8.8-5.4 8.8-10z"/>', '#9D7C38');
  if(t.includes('kelamin'))
    return bungkus('<circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><circle cx="17.5" cy="8" r="2.6"/><path d="M14 19.5a4 4 0 0 1 7.5-1.9"/>', '#B0433C');
  if(t.includes('usia'))
    return bungkus('<path d="M4 20V10M10 20V5M16 20v-8M22 20H2"/>', '#123A73');
  if(t.includes('porsi'))
    return bungkus('<path d="M4 12h16a8 8 0 0 1-16 0z"/><path d="M12 12V4"/><path d="M9 4h6"/>', '#9D7C38');
  return bungkus('<circle cx="12" cy="12" r="8"/>', '#56687D');
}

/** Sisipkan ikon ke setiap kepala kartu pada satu halaman. */
function hiasKartu(root){
  root.querySelectorAll('.card .hd h3').forEach(x=>{
    if(x.querySelector('.ikon')) return;
    x.insertAdjacentHTML('afterbegin', ikonKartu(x.textContent));

}

function card3BDesa(t3){

function cardPorsi(){
  const c = el('div','card');
  c.innerHTML = '<div class="hd"><h3>Rincian porsi per sekolah</h3>'+
    '<div class="note">dari data BNBA · guru dan tendik TK ikut porsi kecil</div></div>';
  if(!store.master.length){
    c.append(el('div','bd','<div style="color:var(--slate);font-size:13px">Daftar sekolah masih kosong.</div>'));
    return c;
  }
  const catatan = {
    'PAUD/TK':'seluruh siswa, guru, dan tendik dihitung porsi kecil',
    'SD/MI':'siswa mengikuti kelas; guru dan tendik porsi besar',
    'SMP/MTs':'seluruh siswa, guru, dan tendik dihitung porsi besar',
    'SMA/MA':'seluruh siswa, guru, dan tendik dihitung porsi besar'
  };
  let h = '<div class="scroller"><table><thead><tr><th>Sekolah</th>'+
    '<th style="text-align:right">Porsi kecil</th><th style="text-align:right">Porsi besar</th>'+
    '<th style="text-align:right">Total siswa</th><th style="text-align:right">Guru</th>'+
    '<th style="text-align:right">Tendik</th><th style="text-align:right">Guru &amp; tendik</th>'+
    '<th style="text-align:right">Total</th></tr></thead><tbody>';
  const gt = {kecil:0,besar:0,siswa:0,guru:0,tendik:0,total:0};
  JENJANG.forEach(j=>{
    const list = store.master.filter(m=>m.jenjang===j);
    if(!list.length) return;
    h += '<tr style="background:var(--navy-lt)"><td colspan="8" style="font-weight:800;color:var(--navy-dk)">'+
      esc(j)+' <span style="font-weight:500;font-style:italic;color:var(--slate)">— '+esc(catatan[j]||'')+'</span></td></tr>';
    list.forEach(m=>{
      const p = hitungSekolah(m.nama);
      gt.kecil+=p.kecil; gt.besar+=p.besar; gt.siswa+=p.siswa;
      gt.guru+=p.guru; gt.tendik+=p.tendik; gt.total+=p.total;
      const n = v => '<td class="mono" style="text-align:right;color:'+(v?'inherit':'var(--line)')+'">'+(v?num(v):'·')+'</td>';
      h += '<tr><td class="nama" title="'+esc(m.nama)+'">'+esc(m.nama)+'</td>'+
        n(p.kecil)+n(p.besar)+
        '<td class="mono" style="text-align:right;font-weight:700">'+num(p.siswa)+'</td>'+
        n(p.guru)+n(p.tendik)+
        '<td class="mono" style="text-align:right;font-weight:700">'+num(p.staf)+'</td>'+
        '<td class="mono" style="text-align:right;font-weight:700">'+num(p.total)+'</td></tr>';

  return [...m.entries()].sort((a,b)=>b[1]-a[1]);
}
function tallyKelas(arr){
  const m = new Map();
  arr.forEach(r=>{ const v=String(r.kelas||'').trim()||'(tidak diisi)'; m.set(v,(m.get(v)||0)+1); });
  return [...m.entries()].sort((a,b)=>{
    const na=parseInt(a[0]), nb=parseInt(b[0]);
    if(!isNaN(na)&&!isNaN(nb)) return na-nb;

function topKey(obj){
  const e = Object.entries(obj).sort((a,b)=>b[1]-a[1]);
  return e.length ? e[0][0] : '';
}
function urutKelas(set){
  return [...set].sort((a,b)=>{
    const na=parseInt(a), nb=parseInt(b);
    if(!isNaN(na)&&!isNaN(nb)) return na-nb;
    return String(a).localeCompare(String(b),'id');
  });
}
function aggSekolah(S){
  const m = new Map();
  S.forEach(r=>{
    const nm = String(r.sekolah||'').trim() || '(tidak diisi)';
    if(!m.has(nm)) m.set(nm,{nama:nm, ids:[], jenjang:{}, desa:{}, kelas:new Set(), L:0, P:0, noNisn:0});
    const o = m.get(nm); o.ids.push(r.id);
    const j = String(r.jenjang||'').trim(); if(j) o.jenjang[j]=(o.jenjang[j]||0)+1;
    const d = String(r.desa||'').trim(); if(d) o.desa[d]=(o.desa[d]||0)+1;
    const k = String(r.kelas||'').trim(); if(k) o.kelas.add(k);
    const g = normJK(r.jk); if(g==='L') o.L++; else if(g==='P') o.P++;
    if(!String(r.nisn||'').trim()) o.noNisn++;
  });
  return [...m.values()].sort((a,b)=>b.ids.length-a.ids.length);
}
function aggPosyandu(T){
  const m = new Map();
  T.forEach(r=>{
    const nm = String(r.posyandu||'').trim() || '(tidak diisi)';
    if(!m.has(nm)) m.set(nm,{nama:nm, ids:[], desa:{}, kat:{}});
    const o = m.get(nm); o.ids.push(r.id);
    const d = String(r.desa||'').trim(); if(d) o.desa[d]=(o.desa[d]||0)+1;
    const k = String(r.kategori||'').trim() || '(lainnya)'; o.kat[k]=(o.kat[k]||0)+1;
  });
  return [...m.values()].sort((a,b)=>b.ids.length-a.ids.length);
}
function lihat(ds, key, val){
  Object.keys(store.filter[ds]).forEach(k=>store.filter[ds][k]='');
  store.filter[ds][key] = val;
  store.q[ds]=''; store.page[ds]=1; store.sel[ds].clear();

}

/** Kumpulkan data BNBA yang tidak cocok dengan master atau daftar baku. */
function dataLuarMaster(){
  const namaMaster = new Set(store.master.map(m=>m.nama));
  const grup = [];
  const tandai = {sekolah:new Set(), tigab:new Set()};

  const kumpul = (ds, jenis, alasan, uji, ambil) => {
    const m = new Map();
    store[ds].forEach(r=>{
      if(tandai[ds].has(r.id)) return;
      const v = String(ambil(r)||'').trim();
      if(uji(v)) return;
      const key = v || '(kosong)';
      if(!m.has(key)) m.set(key,{ds, jenis, alasan, nilai:v, label:key, ids:[]});
      m.get(key).ids.push(r.id);
    });
    m.forEach(g=>{ g.ids.forEach(id=>tandai[ds].add(id)); grup.push(g); });
  };

  kumpul('sekolah','Siswa sekolah','Sekolah tidak ada di master', v=>namaMaster.has(v), r=>r.sekolah);
  kumpul('tigab','Kelompok 3B','Kategori 3B tidak baku', v=>KAT3B.includes(v), r=>r.kategori);
  kumpul('sekolah','Siswa sekolah','Desa di luar wilayah layanan', v=>!v||desaTersedia().includes(v), r=>r.desa);
  kumpul('tigab','Kelompok 3B','Desa di luar wilayah layanan', v=>!v||desaTersedia().includes(v), r=>r.desa);

  return grup.sort((a,b)=>b.ids.length-a.ids.length);
}

async function hapusLuarMaster(grup){
  const idS = new Set(), idT = new Set();
  grup.forEach(g=> g.ids.forEach(id=> (g.ds==='sekolah'?idS:idT).add(id)));
  const total = idS.size + idT.size;
  if(!total){ toast('Tidak ada data di luar master.'); return; }
  if(!confirm('Hapus '+num(total)+' data yang tidak cocok dengan master? Tindakan ini tidak bisa dibatalkan.')) return;
  try{
    for(const [ds,set] of [['sekolah',idS],['tigab',idT]]){
      const ids = [...set];
      for(let i=0;i<ids.length;i+=500){
        await api('remove', ds, ids.slice(i,i+500));
        setSync('busy','Menghapus '+num(Math.min(i+500,ids.length))+'/'+num(ids.length)+'…');
      }
    }
    store.sel.sekolah.clear(); store.sel.tigab.clear();
    await pull();
    toast(num(total)+' data di luar master dihapus.');
  }catch(e){ toast('Gagal: '+e.message); }
}

/* =========================================================
   Rincian per sekolah — kelas, jenis kelamin, porsi
   ========================================================= */
const CATATAN_JENJANG = {
  'PAUD/TK':'seluruh siswa, guru, dan tendik dihitung porsi kecil',
  'SD/MI':'siswa mengikuti pembagian kelas; guru dan tendik porsi besar',
  'SMP/MTs':'seluruh siswa, guru, dan tendik dihitung porsi besar',
  'SMA/MA':'seluruh siswa, guru, dan tendik dihitung porsi besar',
  'Tanpa jenjang':'sekolah belum terdaftar di master — lengkapi lewat Kelola master'
};

function dataRincian(){
  const jenjangDari = {};
  store.master.forEach(m=>jenjangDari[m.nama]=m.jenjang);
  const m = new Map();
  store.sekolah.forEach(r=>{
    const nm = String(r.sekolah||'').trim() || '(tanpa sekolah)';
    if(!m.has(nm)) m.set(nm,{nama:nm,
      jenjang: jenjangDari[nm] || String(r.jenjang||'').trim() || 'Tanpa jenjang',
      kelas:{}, kecil:0, besar:0, siswa:0, guru:0, tendik:0, L:0, P:0, total:0});
    const o = m.get(nm);
    const peran = String(r.peran||'Siswa').trim();
    const porsi = String(r.porsi||'').trim() || porsiOtomatis(r);
    if(porsi==='Kecil') o.kecil++; else if(porsi==='Besar') o.besar++;
    const jk = normJK(r.jk); if(jk==='L') o.L++; else if(jk==='P') o.P++;
    if(peran==='Guru') o.guru++;
    else if(peran==='Tendik') o.tendik++;
    else {
      o.siswa++;
      const k = String(r.kelas||'').trim() || '–';
      if(!o.kelas[k]) o.kelas[k] = {L:0, P:0, n:0};
      o.kelas[k].n++;
      if(jk==='L') o.kelas[k].L++; else if(jk==='P') o.kelas[k].P++;
    }
    o.total++;
  });
  const grup = [];
  JENJANG.concat(['Tanpa jenjang']).forEach(j=>{
    const list = [...m.values()].filter(x=>x.jenjang===j)
      .sort((a,b)=>a.nama.localeCompare(b.nama,'id'));
    if(!list.length) return;
    const set = new Set();
    list.forEach(x=>Object.keys(x.kelas).forEach(k=>set.add(k)));
    const kelas = urutKelas([...set]);
    /* SD/MI dibagi dua rentang karena porsinya memang terbelah di situ */
    let gabung = [];
    if(j==='SD/MI'){
      const bawah = kelas.filter(k=>{const n=parseInt(k); return !isNaN(n) && n<=3;});
      const atas  = kelas.filter(k=>{const n=parseInt(k); return !isNaN(n) && n>=4;});
      if(bawah.length && atas.length)
        gabung = [{label:'Kelas 1–3', kelas:bawah}, {label:'Kelas 4–6', kelas:atas}];
    }
    grup.push({jenjang:j, list, kelas, gabung});
  });
  return grup;
}

const EKOR_RINCIAN = ['Porsi kecil','Porsi besar','Total siswa','L','P','Guru','Tendik','Guru & tendik','Total'];

/** Peta warna dan sekat tiap kolom, dipakai bersama oleh tampilan dan PDF. */
function metaKolom(g, lp){
  const n = lp ? 2 : 1, meta = [];
  const tambah = (jml, t, sekat) => { for(let i=0;i<jml;i++) meta.push({t:t, sekat: sekat && i===0}); };
  g.kelas.forEach((k,i)=>tambah(n, '', i===0));
  (g.gabung||[]).forEach((x,i)=>tambah(n, 'var(--sky-lt)', i===0));
  meta.push({t:'var(--gold-lt)', sekat:true});   // porsi kecil
  meta.push({t:'var(--leaf-lt)'});               // porsi besar
  meta.push({t:'var(--mist)', sekat:true, tebal:true}); // total siswa
  meta.push({t:'var(--mist)'}); meta.push({t:'var(--mist)'});  // L, P
  meta.push({t:'', sekat:true}); meta.push({t:''}); meta.push({t:'', tebal:true}); // guru, tendik, g&t
  meta.push({t:'var(--navy-lt)', sekat:true, tebal:true});     // total
  return meta;
}

function aoaRincian(g, lp){
  const gab = g.gabung || [];
  const kolKelas = [], kolGab = [];
  g.kelas.forEach(k=>{ lp ? kolKelas.push('Kelas '+k+' (L)','Kelas '+k+' (P)') : kolKelas.push('Kelas '+k); });
  gab.forEach(x=>{ lp ? kolGab.push(x.label+' (L)', x.label+' (P)') : kolGab.push(x.label); });
  const head = ['Sekolah'].concat(kolKelas).concat(kolGab).concat(EKOR_RINCIAN);

  const baris = [], t = {kelas:{}, gab:{}, kecil:0,besar:0,siswa:0,L:0,P:0,guru:0,tendik:0,total:0};
  g.kelas.forEach(k=>t.kelas[k]={L:0,P:0,n:0});
  gab.forEach(x=>t.gab[x.label]={L:0,P:0,n:0});

  g.list.forEach(o=>{
    const sel = [];
    g.kelas.forEach(k=>{
      const kk = o.kelas[k] || {L:0,P:0,n:0};
      t.kelas[k].L+=kk.L; t.kelas[k].P+=kk.P; t.kelas[k].n+=kk.n;
      lp ? sel.push(kk.L, kk.P) : sel.push(kk.n);
    });
    gab.forEach(x=>{
      let L=0,P=0,n=0;
      x.kelas.forEach(k=>{ const kk=o.kelas[k]; if(kk){L+=kk.L;P+=kk.P;n+=kk.n;} });
      t.gab[x.label].L+=L; t.gab[x.label].P+=P; t.gab[x.label].n+=n;
      lp ? sel.push(L,P) : sel.push(n);
    });
    t.kecil+=o.kecil; t.besar+=o.besar; t.siswa+=o.siswa;
    t.L+=o.L; t.P+=o.P; t.guru+=o.guru; t.tendik+=o.tendik; t.total+=o.total;
    baris.push([o.nama].concat(sel)
      .concat([o.kecil, o.besar, o.siswa, o.L, o.P, o.guru, o.tendik, o.guru+o.tendik, o.total]));
  });

  const selTot = [];
  g.kelas.forEach(k=>{ lp ? selTot.push(t.kelas[k].L, t.kelas[k].P) : selTot.push(t.kelas[k].n); });
  gab.forEach(x=>{ lp ? selTot.push(t.gab[x.label].L, t.gab[x.label].P) : selTot.push(t.gab[x.label].n); });
  const total = ['JUMLAH '+g.jenjang].concat(selTot)
    .concat([t.kecil, t.besar, t.siswa, t.L, t.P, t.guru, t.tendik, t.guru+t.tendik, t.total]);
  return {head, baris, total, t};
}

/** Kepala tabel tiga tingkat: kelompok besar, nama kolom, lalu L/P. */
function theadRincian(g, lp, warna){
  const w = warna || {};
  const emas = w.emas || 'background:#9D7C38;color:#FFF';
  const hijau = w.hijau || 'background:#5F9B47;color:#FFF';
  const biru = w.biru || 'background:#2F6DA0;color:#FFF';
  const n = lp ? 2 : 1;
  const gab = g.gabung || [];
  const nKelas = g.kelas.length*n, nGab = gab.length*n;

  /* tingkat 1 — pita kelompok */
  let r1 = '<tr class="pita"><th rowspan="'+(lp?3:2)+'" class="kiri">Sekolah</th>'+
    '<th colspan="'+nKelas+'" class="c">Jumlah siswa per kelas</th>'+
    (nGab ? '<th colspan="'+nGab+'" class="c" style="'+biru+'">Gabungan rentang kelas</th>' : '')+
    '<th colspan="2" class="c">Pembagian porsi</th>'+
    '<th colspan="3" class="c">Siswa</th>'+
    '<th colspan="3" class="c">Guru &amp; tendik</th>'+
    '<th rowspan="'+(lp?3:2)+'" class="r">Total</th></tr>';

  /* tingkat 2 — nama kolom */
  let r2 = '<tr>'+
    g.kelas.map(k=>'<th colspan="'+n+'" class="c">'+esc(k)+'</th>').join('')+
    gab.map(x=>'<th colspan="'+n+'" class="c" style="'+biru+'">'+esc(x.label)+'</th>').join('')+
    '<th'+(lp?' rowspan="2"':'')+' class="r" style="'+emas+'">Porsi kecil</th>'+
    '<th'+(lp?' rowspan="2"':'')+' class="r" style="'+hijau+'">Porsi besar</th>'+
    '<th'+(lp?' rowspan="2"':'')+' class="r">Total</th>'+
    '<th'+(lp?' rowspan="2"':'')+' class="r">L</th>'+
    '<th'+(lp?' rowspan="2"':'')+' class="r">P</th>'+
    '<th'+(lp?' rowspan="2"':'')+' class="r">Guru</th>'+
    '<th'+(lp?' rowspan="2"':'')+' class="r">Tendik</th>'+
    '<th'+(lp?' rowspan="2"':'')+' class="r">Jml</th>'+
    '</tr>';

  /* tingkat 3 — L/P */
  let r3 = '';
  if(lp){
    const lpTh = '<th class="r kecil">L</th><th class="r kecil">P</th>';
    r3 = '<tr>'+g.kelas.map(()=>lpTh).join('')+
      gab.map(()=>'<th class="r kecil" style="'+biru+'">L</th><th class="r kecil" style="'+biru+'">P</th>').join('')+
      '</tr>';
  }
  return '<thead>'+r1+r2+r3+'</thead>';
}

function unduhRincianPDF(){
  const grup = dataRincian();
  if(!grup.length){ toast('Belum ada data siswa.'); return; }
  let isi = '', G = {kecil:0,besar:0,siswa:0,L:0,P:0,total:0};
  grup.forEach(g=>{
    const {baris, total, t} = aoaRincian(g, rincianLP);
    ['kecil','besar','siswa','L','P','total'].forEach(k=>G[k]+=t[k]);
    const meta = metaKolom(g, rincianLP);
    const cat = {'var(--sky-lt)':'#E2EEF6','var(--gold-lt)':'#F5EEDF',
                 'var(--leaf-lt)':'#EAF3E4','var(--mist)':'#F0F4F7','var(--navy-lt)':'#E2EDF2'};
    let tb = '<tbody>';
    baris.forEach(r=>{
      tb += '<tr><td>'+esc(r[0])+'</td>'+r.slice(1).map((v,i)=>{
        const m = meta[i]||{};
        return '<td class="r mono'+(m.sekat?' sekat':'')+'" style="'+
          (m.t?'background:'+(cat[m.t]||'#FFF')+';':'')+(m.tebal?'font-weight:700;':'')+'">'+(v?num(v):'-')+'</td>';
      }).join('')+'</tr>';
    });
    tb += '<tr class="tot"><td>'+esc(total[0])+'</td>'+
      total.slice(1).map((v,i)=>'<td class="r mono'+((meta[i]||{}).sekat?' sekat':'')+'">'+num(v)+'</td>').join('')+
      '</tr></tbody>';
    isi += '<h3>'+esc(g.jenjang)+' <span style="font-weight:400;font-style:italic;color:#56687D">— '+
      esc(CATATAN_JENJANG[g.jenjang]||'')+'</span></h3>'+
      '<table>'+theadRincian(g, rincianLP)+tb+'</table>';
  });
  cetakPDF('Rincian Penerima Manfaat Per Sekolah',
    'Rincian per kelas dan jenis kelamin beserta pembagian porsi', isi,

/* ---------- Excel berformat ---------- */
const XLW = {
  navy:'FF061D42', navy2:'FF123A73', navyL:'FFE2EDF2', emas:'FF9D7C38', emasL:'FFF5EEDF',
  zebra:'FFF5F9FC', garis:'FFB5C4D2', abu:'FF56687D'
};
const tepiTipis = () => ({
  top:{style:'thin',color:{argb:XLW.garis}}, left:{style:'thin',color:{argb:XLW.garis}},
  bottom:{style:'thin',color:{argb:XLW.garis}}, right:{style:'thin',color:{argb:XLW.garis}}
});
/** Baris kelompok jenjang: hanya satu sel yang terisi. */
const barisGrup = row => row.filter(c=>c!=='' && c!=null).length===1;
const barisTotal = row => /^(TOTAL|JUMLAH)/i.test(String(row[0]||'')) || /^(TOTAL|JUMLAH)/i.test(String(row[1]||''));

async function unduhXLSX(namaFile, lembar){
  if(typeof ExcelJS === 'undefined'){ unduhXLSXPolos(namaFile, lembar); return; }
  try{
    const wb = new ExcelJS.Workbook();
    wb.creator = INSTANSI.unit;
    wb.created = new Date();

    lembar.forEach(L=>{
      const aoa = L.aoa || [];
      const nKol = Math.max(1, ...aoa.map(r=>r.length));
      const ws = wb.addWorksheet(L.nama.replace(/[\\\/\?\*\[\]:]/g,'-').slice(0,31),
        {views:[{state:'frozen', ySplit:6, xSplit:1}], pageSetup:{orientation:'landscape', fitToPage:true, fitToWidth:1, fitToHeight:0}});

      /* blok judul */
      const judul = [INSTANSI.badan, INSTANSI.unit, L.judul, 'Dicetak: '+tglPanjang()];
      judul.forEach((t,i)=>{
        const r = i+1;
        ws.mergeCells(r, 1, r, nKol);
        const c = ws.getCell(r, 1);
        c.value = t;
        c.alignment = {horizontal:'center', vertical:'middle'};
        c.font = i===0 ? {name:'Calibri', size:10, bold:true, color:{argb:XLW.navy}}
               : i===1 ? {name:'Calibri', size:13, bold:true, color:{argb:XLW.navy}}
               : i===2 ? {name:'Calibri', size:11, bold:true, color:{argb:'FFFFFFFF'}}
               :         {name:'Calibri', size:9, italic:true, color:{argb:XLW.abu}};
        if(i===2) c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:XLW.navy2}};
        if(i===3) c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:XLW.emasL}};
        ws.getRow(r).height = i===1 ? 20 : 16;
      });
      ws.getRow(5).height = 6;

      /* header di baris 6 */
      const head = aoa[0] || [];
      const hr = ws.getRow(6);
      head.forEach((t,i)=>{
        const c = hr.getCell(i+1);
        c.value = t;
        c.font = {name:'Calibri', size:9.5, bold:true, color:{argb:'FFFFFFFF'}};
        c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:XLW.navy}};
        c.alignment = {horizontal:'center', vertical:'middle', wrapText:true};
        c.border = tepiTipis();
      });
      hr.height = 30;

      /* isi */
      let baris = 6;
      aoa.slice(1).forEach((row, idx)=>{
        baris++;
        const r = ws.getRow(baris);
        const grup = barisGrup(row), total = barisTotal(row);
        for(let i=0;i<nKol;i++){
          const c = r.getCell(i+1);
          const v = row[i];
          c.value = (v===''||v==null) ? null : v;
          c.border = tepiTipis();
          c.font = {name:'Calibri', size:9.5,
                    bold: grup || total,
                    color:{argb: total ? 'FFFFFFFF' : (grup ? XLW.navy : 'FF08172E')}};
          c.alignment = {horizontal: i===0 ? 'left' : (typeof v==='number' ? 'right' : 'left'),
                         vertical:'middle'};
          if(typeof v === 'string' && /^\d{6,}$/.test(v)) c.numFmt = '@';   // NIK/NISN tetap teks
          if(total) c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:XLW.navy}};
          else if(grup) c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:XLW.navyL}};
          else if(idx % 2 === 1) c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:XLW.zebra}};
        }
        if(grup) ws.mergeCells(baris, 1, baris, nKol);
        r.height = 15;
      });

      /* lebar kolom mengikuti isi terpanjang */
      for(let i=0;i<nKol;i++){
        let lebar = String(head[i]||'').length + 2;
        aoa.slice(1).forEach(row=>{
          const t = String(row[i]==null?'':row[i]);
          if(t.length + 2 > lebar) lebar = t.length + 2;
        });
        ws.getColumn(i+1).width = Math.min(Math.max(lebar, 6), 38);
      }
      if(aoa.length > 1){
        ws.autoFilter = {from:{row:6, column:1}, to:{row:6, column:nKol}};
      }
    });

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = namaFile+'-'+stamp()+'.xlsx';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1200);
    toast('Berkas Excel diunduh.');
  }catch(e){
    console.error(e);
    toast('Gagal membuat Excel berformat, memakai versi sederhana.');
    unduhXLSXPolos(namaFile, lembar);
  }
}

/** Cadangan bila ExcelJS gagal dimuat — tanpa warna, isinya tetap sama. */
function unduhXLSXPolos(namaFile, lembar){
  const wb = XLSX.utils.book_new();
  lembar.forEach(L=>{
    const judul = [[INSTANSI.badan],[INSTANSI.unit],[L.judul],['Dicetak: '+tglPanjang()],[]];
    const ws = XLSX.utils.aoa_to_sheet(judul.concat(L.aoa));
    const n = (L.aoa[0]||[]).length;
    ws['!cols'] = (L.aoa[0]||[]).map((_,i)=>({wch: i===0?6:(i===1?32:14)}));
    ws['!merges'] = [0,1,2,3].map(r=>({s:{r,c:0}, e:{r,c:Math.max(0,n-1)}}));
    XLSX.utils.book_append_sheet(wb, ws, L.nama.slice(0,31));
  });
  XLSX.writeFile(wb, namaFile+'-'+stamp()+'.xlsx');
}

/** Ubah AOA jadi tabel HTML untuk PDF; baris jenjang dan TOTAL diberi gaya khusus. */
function aoaKeHTML(aoa, kananMulai){
  kananMulai = kananMulai==null ? 4 : kananMulai;

  aoa.slice(1).forEach(row=>{
    const kosong = row.filter(c=>c!=='' && c!=null).length;
    const grup = kosong===1;
    const total = String(row[1]).toUpperCase()==='TOTAL';
    if(grup){
      h += '<tr class="grup"><td colspan="'+row.length+'">'+esc(row.find(c=>c!=='' && c!=null))+'</td></tr>';

        '<td'+(i>=kananMulai?' class="r mono"':'')+'>'+esc(c===0?'0':(c||''))+'</td>').join('')+'</tr>';

  ]);

function unduhSiswaPDF(namaSekolah){
  const daftar = namaSekolah
    ? store.sekolah.filter(r=>String(r.sekolah||'').trim()===namaSekolah)
    : store.sekolah.slice();
  if(!daftar.length){ toast('Belum ada data siswa untuk diunduh.'); return; }
  daftar.sort((a,b)=> String(a.sekolah||'').localeCompare(String(b.sekolah||''),'id')
    || String(a.kelas||'').localeCompare(String(b.kelas||''),'id',{numeric:true})
    || String(a.nama||'').localeCompare(String(b.nama||''),'id'));

  const kol = ['nama','nisn','nik','jk','tgl_lahir','kelas','peran','porsi','desa','wali'];
  let h = '<table><thead><tr><th style="width:26px">No</th>'+
    kol.map(c=>'<th>'+esc(LABEL[c])+'</th>').join('')+'<th class="r">Umur</th></tr></thead><tbody>';
  let no=0, sekTerakhir=null;
  daftar.forEach(r=>{
    const s = String(r.sekolah||'').trim();
    if(!namaSekolah && s!==sekTerakhir){
      sekTerakhir = s;
      h += '<tr class="grup"><td colspan="'+(kol.length+2)+'">'+esc(s||'(tanpa sekolah)')+'</td></tr>';
    }
    const u = umurDetail(r.tgl_lahir);
    h += '<tr><td class="c mono">'+(++no)+'</td>'+
      kol.map(c=>'<td'+(c==='nik'||c==='nisn'?' class="mono"':'')+'>'+esc(r[c]||'—')+'</td>').join('')+
      '<td class="r mono">'+esc(u?u.teks:'—')+'</td></tr>';
  });
  h += '</tbody></table>';

  const kecil = daftar.filter(r=>r.porsi==='Kecil').length;
  const besar = daftar.filter(r=>r.porsi==='Besar').length;
  cetakPDF('Daftar Penerima Manfaat — Siswa Sekolah',
    namaSekolah || 'Seluruh satuan pendidikan', h,
    {landscape:true, meta:'<span>Jumlah: <b>'+num(daftar.length)+'</b> jiwa</span>'+
      '<span>Porsi kecil: <b>'+num(kecil)+'</b></span><span>Porsi besar: <b>'+num(besar)+'</b></span>'+
      (namaSekolah?'<span>Sekolah: <b>'+esc(namaSekolah)+'</b></span>':'')});
}
function unduhSiswaXLSX(namaSekolah){
  if(namaSekolah){
    const d = store.sekolah.filter(r=>String(r.sekolah||'').trim()===namaSekolah);
    if(!d.length){ toast('Belum ada data siswa untuk sekolah ini.'); return; }
    unduhXLSX('BNBA-'+namaSekolah.replace(/[^\w\s-]/g,'').slice(0,40),
      [{nama:'Data Siswa', judul:'DAFTAR PENERIMA MANFAAT — '+namaSekolah.toUpperCase(), aoa:aoaSiswa(d)}]);
    return;
  }
  const lembar = [{nama:'Semua Siswa', judul:'DAFTAR PENERIMA MANFAAT \u2014 SELURUH SISWA', aoa:aoaSiswa(store.sekolah)}];
  store.master.forEach(m=>{
    const d = store.sekolah.filter(r=>String(r.sekolah||'').trim()===m.nama);
    if(d.length) lembar.push({nama:m.nama.replace(/[\\\/\?\*\[\]:]/g,'').slice(0,31),
      judul:'DAFTAR PENERIMA MANFAAT — '+m.nama.toUpperCase(), aoa:aoaSiswa(d)});
  });
  unduhXLSX('BNBA-Siswa-Sekolah', lembar);
}
function unduh3BPDF(){
  const d = store.tigab.slice().sort((a,b)=>
    KAT3B.indexOf(a.kategori)-KAT3B.indexOf(b.kategori) ||
    String(a.desa||'').localeCompare(String(b.desa||''),'id') ||
    String(a.nama||'').localeCompare(String(b.nama||''),'id'));
  if(!d.length){ toast('Belum ada data 3B untuk diunduh.'); return; }
  const kol = ['nama','nik','jk','tgl_lahir','detail','posyandu','desa','wali','hp'];
  let h = '<table><thead><tr><th style="width:26px">No</th>'+
    kol.map(c=>'<th>'+esc(LABEL[c])+'</th>').join('')+'<th class="r">Umur</th></tr></thead><tbody>';
  let no=0, katTerakhir=null;
  d.forEach(r=>{
    const k = String(r.kategori||'').trim();
    if(k!==katTerakhir){ katTerakhir=k;
      h += '<tr class="grup"><td colspan="'+(kol.length+2)+'">'+esc(k||'(tanpa kategori)')+'</td></tr>'; }
    const u = umurDetail(r.tgl_lahir);
    h += '<tr><td class="c mono">'+(++no)+'</td>'+
      kol.map(c=>'<td'+(c==='nik'?' class="mono"':'')+'>'+esc(r[c]||'—')+'</td>').join('')+
      '<td class="r mono">'+esc(u?u.teks:'—')+'</td></tr>';
  });
  h += '</tbody></table>';
  cetakPDF('Daftar Penerima Manfaat — Kelompok 3B',
    'Ibu hamil, ibu menyusui, ibu nifas, dan balita/baduta', h,
    {landscape:true, meta:'<span>Jumlah: <b>'+num(d.length)+'</b> jiwa</span>'+
      '<span>Sasaran: <b>'+num(target3B().total)+'</b></span>'});
}
function unduh3BXLSX(){
  if(!store.tigab.length){ toast('Belum ada data 3B untuk diunduh.'); return; }
  const lembar = [{nama:'Semua 3B', judul:'DAFTAR PENERIMA MANFAAT — KELOMPOK 3B', aoa:aoa3B(store.tigab)}];
  KAT3B.forEach(k=>{
    const d = store.tigab.filter(r=>String(r.kategori||'').trim()===k);
    if(d.length) lembar.push({nama:k.replace(/[\\\/\?\*\[\]:]/g,'').slice(0,31),
      judul:'DAFTAR PENERIMA MANFAAT — '+k.toUpperCase(), aoa:aoa3B(d)});
  });
  unduhXLSX('BNBA-Kelompok-3B', lembar);
}
